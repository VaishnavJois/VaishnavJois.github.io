<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/temporary-titlebar-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vaishnav Jois — Cloud &amp; Open-Source Enthusiast</title>
    <meta name="description" content="Personal portfolio of Vaishnav Jois — Cloud &amp; Open-Source Enthusiast" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          if (stored === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
            if (!stored) {
              localStorage.setItem('theme', 'dark');
            }
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
